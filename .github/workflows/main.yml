name: Build and Release

on:
  push:
    branches: [ "master", "main", "feature_state_machine" ]
    tags: [ "v*" ] # Trigger release workflow on version tags
  pull_request:
    branches: [ "master", "main", "feature_state_machine" ]

env:
  SOLUTION_NAME: Main\FluorescenceFullAutomatic.sln
  TEST_DLL: TestMain\bin\Release\TestMain.dll

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history for versioning

    # 1. Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.packages.config', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup VSTest
      uses: darenm/Setup-VSTest@v1

    - name: Restore NuGet Packages
      run: nuget restore ${{ env.SOLUTION_NAME }}

    # 2. Get Version (from Tag or default)
    - name: Get Version
      id: get_version
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
          $version = $matches[1]
        } else {
          $version = "1.0.0-build." + $env:GITHUB_RUN_NUMBER
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Detected Version: $version"

    # 3. Build with Version
    - name: Build Solution
      run: msbuild ${{ env.SOLUTION_NAME }} /p:Configuration=Release /p:Platform="Any CPU" /p:Version=${{ steps.get_version.outputs.VERSION }}

    # 4. Run Tests and Generate Report
    - name: Run Tests
      # /Logger:trx generates a .trx file for the reporter
      run: vstest.console.exe ${{ env.TEST_DLL }} /Logger:trx;LogFileName=test_results.trx
      continue-on-error: true # Ensure reporter runs even if tests fail

    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure() # Run even if tests fail
      with:
        name: Auto-Tests
        path: "TestResults/*.trx"
        reporter: dotnet-trx

    # 5. Build Installer (Inno Setup)
    - name: Compile Installer
      uses: minhaskamal/inno-setup-action@v1
      with:
        path: setup.iss
        # Pass version to script override
        options: /DMyAppVersion=${{ steps.get_version.outputs.VERSION }}

    # 6. Zip Artifacts (Optional: keep zip for raw bin access, or just keep installer)
    - name: Zip Release
      run: |
        powershell Compress-Archive -Path Main\bin\Release\* -DestinationPath FluorescenceFullAutomatic-Bin-${{ steps.get_version.outputs.VERSION }}.zip

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: setup-installer
        path: Output/*.exe

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: binary-package
        path: FluorescenceFullAutomatic-Bin-${{ steps.get_version.outputs.VERSION }}.zip

  # 7. Create Release Job (Only runs on tags)
  create-release:
    name: Create GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Installer
      uses: actions/download-artifact@v4
      with:
        name: setup-installer

    - name: Download Binaries
      uses: actions/download-artifact@v4
      with:
        name: binary-package

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          *.exe
          *.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}